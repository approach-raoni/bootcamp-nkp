apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: loja-site
    files:
      - index.html=site/index.html
  - name: loja-nginx
    files:
      - nginx.conf=nginx/nginx.conf
generatorOptions:
  disableNameSuffixHash: false
